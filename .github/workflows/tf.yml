name: Terraform CI Pipeline

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: [self-hosted, amazonlinux, dev]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Runner Environment
        run: |
          echo "USER:"
          whoami

          echo "SHELL:"
          echo "$SHELL"

          echo "PATH:"
          echo "$PATH"

          echo "BASH:"
          echo "$BASH"

          echo "SUDO:"
          command -v sudo

          echo "TERRAFORM:"
          command -v terraform

          echo "RUNNER TEMP:"
          echo "$RUNNER_TEMP"

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
